<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
  <title id="title">Cost to summarize 1,000 AI papers</title>
  <desc id="desc">Completed-summary inference cost for 1,000 papers. DeepSeek V4 Flash cost 3 dollars and 99 cents, GPT-5.6 Luna cost 6 dollars, and Claude Haiku 4.5 cost 35 dollars and 76 cents.</desc>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#15156b" stroke-width="2"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#15156b"/>
      <circle cx="8" cy="7" r="1" fill="#15156b" opacity=".65"/>
    </pattern>
  </defs>

  <rect width="1800" height="820" fill="#fffefb"/>
  <g transform="translate(76 48)">
    <circle cx="10" cy="10" r="9" fill="#caaef5"/>
    <circle cx="27" cy="10" r="9" fill="#ee3f8f"/>
    <circle cx="18" cy="26" r="9" fill="#fc4c02"/>
    <text x="45" y="22" fill="#121212" font-family="Arial, Helvetica, sans-serif" font-size="22">YEAR IN AI PAPERS / BENCHMARK</text>
  </g>
  <line x1="76" y1="110" x2="1724" y2="110" stroke="#d9d8d3"/>

  <text x="76" y="205" fill="#121212" font-family="Iowan Old Style, Baskerville, Times New Roman, serif" font-size="76" letter-spacing="-2">What 1,000 summaries cost.</text>
  <text x="78" y="262" fill="#56544f" font-family="Arial, Helvetica, sans-serif" font-size="25">Completed-result inference only · same 1,000-paper corpus</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="78" y="377" fill="#121212" font-size="25" font-weight="700">DeepSeek V4 Flash</text>
    <text x="78" y="412" fill="#56544f" font-size="19">$0.003995 / paper</text>
    <line x1="430" y1="391" x2="1580" y2="391" stroke="#d9d8d3"/>
    <rect x="430" y="365" width="124" height="52" fill="url(#hatch)" stroke="#15156b" stroke-width="2"/>
    <line x1="554" y1="354" x2="554" y2="429" stroke="#ee3f8f" stroke-width="4"/>
    <text x="575" y="404" fill="#15156b" font-family="Iowan Old Style, Baskerville, serif" font-size="43" font-weight="700">$3.99</text>
    <text x="1660" y="402" fill="#ee3f8f" font-family="SFMono-Regular, Consolas, monospace" font-size="16" text-anchor="end">1.00×</text>

    <text x="78" y="500" fill="#121212" font-size="25" font-weight="700">GPT-5.6 Luna</text>
    <text x="78" y="535" fill="#56544f" font-size="19">$0.006004 / paper</text>
    <line x1="430" y1="514" x2="1580" y2="514" stroke="#d9d8d3"/>
    <rect x="430" y="488" width="187" height="52" fill="url(#dots)" stroke="#15156b" stroke-width="2"/>
    <line x1="617" y1="477" x2="617" y2="552" stroke="#00afaa" stroke-width="4"/>
    <text x="638" y="527" fill="#15156b" font-family="Iowan Old Style, Baskerville, serif" font-size="43" font-weight="700">$6.00</text>
    <text x="1660" y="525" fill="#00afaa" font-family="SFMono-Regular, Consolas, monospace" font-size="16" text-anchor="end">1.50× DEEPSEEK</text>

    <text x="78" y="623" fill="#121212" font-size="25" font-weight="700">Claude Haiku 4.5</text>
    <text x="78" y="658" fill="#56544f" font-size="19">$0.035755 / paper</text>
    <line x1="430" y1="637" x2="1580" y2="637" stroke="#d9d8d3"/>
    <rect x="430" y="611" width="1112" height="52" fill="url(#hatch)" stroke="#15156b" stroke-width="2"/>
    <line x1="1542" y1="600" x2="1542" y2="675" stroke="#fc4c02" stroke-width="4"/>
    <rect x="1325" y="618" width="190" height="38" fill="#fffefb"/>
    <text x="1498" y="650" fill="#15156b" font-family="Iowan Old Style, Baskerville, serif" font-size="43" font-weight="700" text-anchor="end">$35.76</text>
    <text x="1660" y="648" fill="#fc4c02" font-family="SFMono-Regular, Consolas, monospace" font-size="16" text-anchor="end">8.95× DEEPSEEK</text>
  </g>

  <line x1="76" y1="725" x2="1724" y2="725" stroke="#121212"/>
  <text x="76" y="765" fill="#56544f" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="16" letter-spacing="1">3,000 / 3,000 COMPLETED</text>
  <text x="1724" y="765" fill="#56544f" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="16" text-anchor="end">FAILED + SUPERSEDED RUNS EXCLUDED · FROZEN STANDARD PRICING</text>
  <path d="M1698 170h26m-13-13v26" stroke="#2f63ff" stroke-width="2"/>
  <circle cx="1667" cy="171" r="5" fill="#f2c600"/>
</svg>
