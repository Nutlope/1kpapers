<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark approach</title>
  <desc id="desc">One thousand public AI PDFs were locally extracted, summarized with the same prompt by three models, and measured using provider token usage and frozen prices.</desc>
  <defs>
    <pattern id="pipelineDots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#15156b"/>
      <circle cx="7" cy="7" r=".8" fill="#15156b" opacity=".7"/>
    </pattern>
    <pattern id="pipelineHatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#15156b" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1800" height="760" fill="#fffefb"/>
  <g transform="translate(76 48)">
    <circle cx="10" cy="10" r="9" fill="#caaef5"/>
    <circle cx="27" cy="10" r="9" fill="#ee3f8f"/>
    <circle cx="18" cy="26" r="9" fill="#fc4c02"/>
    <text x="45" y="22" fill="#121212" font-family="Arial, Helvetica, sans-serif" font-size="22">YEAR IN AI PAPERS / METHOD</text>
  </g>
  <line x1="76" y1="110" x2="1724" y2="110" stroke="#d9d8d3"/>
  <text x="76" y="205" fill="#121212" font-family="Iowan Old Style, Baskerville, Times New Roman, serif" font-size="76" letter-spacing="-2">From public PDFs to measured cost.</text>

  <g transform="translate(76 278)" font-family="Arial, Helvetica, sans-serif">
    <g>
      <text x="0" y="25" fill="#ee3f8f" font-family="SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="2">01 / CORPUS</text>
      <g transform="translate(0 58)" stroke="#15156b" stroke-width="2" fill="none">
        <path d="M24 22h132v146H24z" fill="url(#pipelineHatch)"/>
        <path d="M42 6h132v146"/>
        <path d="M60-10h132v146"/>
        <path d="M43 51h94M43 70h76M43 89h89"/>
      </g>
      <text x="220" y="101" fill="#121212" font-family="Iowan Old Style, Baskerville, serif" font-size="58">1,000</text>
      <text x="220" y="137" fill="#121212" font-size="22" font-weight="700">public AI papers</text>
      <text x="220" y="171" fill="#56544f" font-size="18">30,681 PDF pages</text>
    </g>

    <path d="M414 128h45m-13-13 13 13-13 13" fill="none" stroke="#fc4c02" stroke-width="3"/>

    <g transform="translate(482 0)">
      <text x="0" y="25" fill="#2f63ff" font-family="SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="2">02 / EXTRACT</text>
      <g transform="translate(12 58)" stroke="#15156b" stroke-width="2" fill="none">
        <rect x="0" y="18" width="126" height="150" fill="url(#pipelineDots)"/>
        <circle cx="126" cy="63" r="48" fill="#fffefb"/>
        <circle cx="126" cy="63" r="36"/>
        <path d="m160 97 54 54M18 51h68M18 72h58M18 93h72M18 114h48"/>
      </g>
      <text x="230" y="101" fill="#121212" font-family="Iowan Old Style, Baskerville, serif" font-size="58">102.7M</text>
      <text x="230" y="137" fill="#121212" font-size="22" font-weight="700">text characters</text>
      <text x="230" y="171" fill="#56544f" font-size="18">processed locally</text>
    </g>

    <path d="M896 128h45m-13-13 13 13-13 13" fill="none" stroke="#00afaa" stroke-width="3"/>

    <g transform="translate(964 0)">
      <text x="0" y="25" fill="#00afaa" font-family="SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="2">03 / SUMMARIZE</text>
      <g transform="translate(8 58)" stroke="#15156b" stroke-width="2" fill="none">
        <circle cx="80" cy="82" r="56" fill="url(#pipelineHatch)"/>
        <circle cx="80" cy="82" r="29" fill="#fffefb"/>
        <circle cx="174" cy="44" r="34" fill="url(#pipelineDots)"/>
        <circle cx="174" cy="44" r="16" fill="#fffefb"/>
        <circle cx="177" cy="131" r="42" fill="url(#pipelineDots)"/>
        <circle cx="177" cy="131" r="20" fill="#fffefb"/>
        <path d="M80 11v-19M80 172v19M9 82h-19M151 82h20"/>
      </g>
      <text x="235" y="101" fill="#121212" font-family="Iowan Old Style, Baskerville, serif" font-size="58">3</text>
      <text x="235" y="137" fill="#121212" font-size="20" font-weight="700">same prompt</text>
      <text x="235" y="171" fill="#56544f" font-size="18">reasoning disabled</text>
    </g>

    <path d="M1325 128h38m-13-13 13 13-13 13" fill="none" stroke="#f2c600" stroke-width="3"/>

    <g transform="translate(1375 0)">
      <text x="0" y="25" fill="#fc4c02" font-family="SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="2">04 / PRICE</text>
      <g transform="translate(7 53)" stroke="#15156b" stroke-width="2" fill="none">
        <path d="M0 0h155v166l-14-10-14 10-14-10-14 10-14-10-14 10-14-10-14 10-14-10-15 10z" fill="url(#pipelineDots)"/>
        <path d="M24 40h105M24 65h82M24 90h97M24 115h65"/>
        <circle cx="116" cy="126" r="24" fill="#fffefb"/>
        <path d="M116 113v26M107 120h13a7 7 0 0 1 0 14h-13"/>
      </g>
      <text x="170" y="101" fill="#121212" font-family="Iowan Old Style, Baskerville, serif" font-size="36">Tokens</text>
      <text x="170" y="137" fill="#121212" font-size="18" font-weight="700">× frozen rate</text>
      <text x="170" y="171" fill="#56544f" font-size="17">per model</text>
    </g>
  </g>

  <line x1="76" y1="640" x2="1724" y2="640" stroke="#121212"/>
  <text x="76" y="684" fill="#56544f" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="15">FULL-TEXT SINGLE PASS WHEN IT FITS · 50K-CHARACTER MAP/REDUCE FOR OVERSIZED PAPERS</text>
  <circle cx="1638" cy="682" r="6" fill="#ee3f8f"/>
  <circle cx="1666" cy="682" r="6" fill="#fc4c02"/>
  <circle cx="1694" cy="682" r="6" fill="#00afaa"/>
  <path d="M1724 668v28m-14-14h28" stroke="#2f63ff" stroke-width="2"/>
</svg>
